<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Footage Gallery</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --accent: #6366f1; /* Indigo */
            --accent-glow: rgba(99, 102, 241, 0.5);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Background Glows */
        .ambient-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            background: var(--accent);
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            z-index: -1;
            animation: float 10s ease-in-out infinite alternate;
        }
        .glow-1 { top: -100px; left: -100px; }
        .glow-2 { bottom: -100px; right: -100px; animation-delay: -5s; background: #ec4899; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 30px) scale(1.1); }
        }

        /* Layout */
        .container {
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Search Header */
        .header {
            display: flex;
            gap: 12px;
            position: relative;
            z-index: 10;
        }

        .search-wrapper {
            flex: 1;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: var(--text-muted);
            transition: fill 0.3s ease;
        }

        input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--text-main);
            outline: none;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
            box-shadow: 0 4px 24px rgba(0,0,0,0.2);
        }

        input:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        input:focus + .search-icon {
            fill: var(--accent);
        }

        button.search-btn {
            padding: 0 24px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--accent-glow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button.search-btn:active {
            transform: scale(0.95);
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 50vh;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .empty-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 24px;
            opacity: 0.8;
        }

        .empty-state h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 15px;
            max-width: 280px;
            line-height: 1.5;
        }

        /* Gallery */
        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding-bottom: 100px; /* Space for main button */
        }

        .video-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeUp 0.5s ease backwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .video-card:active {
            transform: scale(0.96);
        }

        .video-card.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent), 0 8px 24px rgba(0,0,0,0.3);
        }

        .video-card video {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            background: #111;
        }

        .video-info {
            padding: 12px;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
        }

        .video-author {
            font-size: 12px;
            color: #fff;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Animated Checkmark */
        .checkmark-wrapper {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .video-card.selected .checkmark-wrapper {
            background: var(--accent);
            border-color: var(--accent);
            transform: scale(1.1);
        }

        .checkmark-icon {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: white;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 20;
            stroke-dashoffset: 20;
            transition: stroke-dashoffset 0.3s ease 0.1s;
        }

        .video-card.selected .checkmark-icon {
            stroke-dashoffset: 0;
        }

        /* Loading */
        .loader {
            display: none;
            width: 48px;
            height: 48px;
            border: 4px solid var(--glass-border);
            border-bottom-color: var(--accent);
            border-radius: 50%;
            margin: 40px auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="container">
        <div class="header">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Шукати футажі (nature, city...)">
                <svg class="search-icon" viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </div>
            <button class="search-btn" onclick="search()">Пошук</button>
        </div>

        <div class="empty-state" id="emptyState">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="url(#gradient)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#6366f1" />
                        <stop offset="100%" stop-color="#ec4899" />
                    </linearGradient>
                </defs>
                <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
                <line x1="7" y1="2" x2="7" y2="22"></line>
                <line x1="17" y1="2" x2="17" y2="22"></line>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <line x1="2" y1="7" x2="7" y2="7"></line>
                <line x1="2" y1="17" x2="7" y2="17"></line>
                <line x1="17" y1="17" x2="22" y2="17"></line>
                <line x1="17" y1="7" x2="22" y2="7"></line>
            </svg>
            <h2>Footage Finder</h2>
            <p>Введи ключове слово, щоб знайти ідеальний футаж для свого наступного проєкту.</p>
        </div>

        <div class="loader" id="loader"></div>
        
        <div class="gallery" id="gallery"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Розгортаємо на весь екран
        
        // Встановлюємо кольори під тему (якщо є)
        tg.setHeaderColor('#09090b');
        tg.setBackgroundColor('#09090b');

        let selectedUrls = new Set();
        
        function search() {
            const query = document.getElementById('searchInput').value.trim();
            if(!query) return;

            // Ховаємо пустий стан, показуємо лоадер
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('gallery').innerHTML = '';
            document.getElementById('loader').style.display = 'block';

            // Даємо легку вібрацію
            tg.HapticFeedback.impactOccurred('light');

            fetch(`/api/search?q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loader').style.display = 'none';
                    if (data.videos.length === 0) {
                        showError("Нічого не знайдено 😔");
                    } else {
                        renderGallery(data.videos);
                    }
                })
                .catch(err => {
                    document.getElementById('loader').style.display = 'none';
                    showError("Помилка завантаження. Спробуй ще раз.");
                });
        }

        function showError(msg) {
            const empty = document.getElementById('emptyState');
            empty.style.display = 'flex';
            empty.querySelector('h2').textContent = "Упс!";
            empty.querySelector('p').textContent = msg;
        }

        function renderGallery(videos) {
            const gallery = document.getElementById('gallery');
            
            videos.forEach((vid, index) => {
                const card = document.createElement('div');
                card.className = 'video-card';
                // Анімація каскадом
                card.style.animationDelay = `${index * 0.05}s`;
                
                if (selectedUrls.has(vid.hd_url)) {
                    card.classList.add('selected');
                }

                card.innerHTML = `
                    <video src="${vid.sd_url}" autoplay loop muted playsinline disablePictureInPicture></video>
                    <div class="video-info">
                        <div class="video-author">📸 ${vid.author}</div>
                    </div>
                    <div class="checkmark-wrapper">
                        <svg class="checkmark-icon" viewBox="0 0 24 24">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                `;
                
                card.onclick = () => toggleSelect(card, vid.hd_url);
                gallery.appendChild(card);
            });
        }

        function toggleSelect(card, hd_url) {
            tg.HapticFeedback.selectionChanged();
            
            if (selectedUrls.has(hd_url)) {
                selectedUrls.delete(hd_url);
                card.classList.remove('selected');
            } else {
                selectedUrls.add(hd_url);
                card.classList.add('selected');
            }
            updateMainButton();
        }

        function updateMainButton() {
            if (selectedUrls.size > 0) {
                tg.MainButton.text = `ЗАВАНТАЖИТИ ZIP (${selectedUrls.size})`;
                tg.MainButton.color = '#6366f1';
                tg.MainButton.textColor = '#ffffff';
                if (!tg.MainButton.isVisible) tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        tg.MainButton.onClick(() => {
            tg.HapticFeedback.impactOccurred('medium');
            const urls = Array.from(selectedUrls);
            tg.sendData(JSON.stringify({ action: "download_zip", urls: urls }));
        });

        // Запуск пошуку клавішею Enter
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                search();
                // Ховаємо клавіатуру
                this.blur(); 
            }
        });
    </script>
</body>
</html>
