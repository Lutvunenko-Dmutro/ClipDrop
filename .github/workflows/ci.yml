name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Перевірка коду (Checkout)
      uses: actions/checkout@v4
      
    - name: Налаштування Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        
    - name: Встановлення залежностей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Лінтер та Форматер (Ruff)
      run: |
        # Перевірка синтаксису та імпортів
        ruff check .
        # Перевірка форматування
        ruff format --check .
        
    - name: Базова перевірка імпортів
      run: |
        # Якщо в коді є помилки імпортів, цей рядок впаде
        python -m py_compile main.py
        
    - name: Запуск тестів (pytest)
      run: |
        pytest tests/
        
    - name: Trigger Render Deploy Hook
      if: success()
      run: |
        if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
          echo "RENDER_DEPLOY_HOOK_URL secret is not set, skipping deploy."
        else
          curl -X GET "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deploy triggered!"
        fi
